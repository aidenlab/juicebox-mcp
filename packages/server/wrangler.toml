name = "juicebox-mcp"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
# The Cloudflare account that owns 3dg.io and the Juicebot Pages projects; the login
# reaches more than one, and wrangler will not choose in a script. Every [env.*] inherits it.
account_id = "1eadb18bb8557fd1bd06b1d0310a902e"

# The top level holds what every [env.*] shares and the vars `wrangler dev` and the tests read.
# It names no route, so a bare `wrangler deploy` reaches no address; deploy with --env.
workers_dev = false
preview_urls = false

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[[durable_objects.bindings]]
name = "WEBSOCKET_ROOM"
class_name = "WebSocketRoom"

[[durable_objects.bindings]]
name = "MCP_SESSION"
class_name = "McpSession"

[[migrations]]
tag = "v1"
new_classes = ["WebSocketRoom"]

[[migrations]]
tag = "v2"
new_classes = ["McpSession"]

[vars]
# The page join links and snapshot links open (not this Worker): a local juicebox-view.
# For a deployed stack this is its Page; see [env.*] below.
BROWSER_URL = "http://localhost:5173/"
TINYURL_DOMAIN = "t.3dg.io"
TINYURL_ENDPOINT = "https://api.tinyurl.com/create"
# Pages that may open /ws (exact Origin match). WebSockets are not covered by CORS.
ALLOWED_ORIGINS = [
  "http://localhost:5173",
  "http://127.0.0.1:5173",
]

# Secrets (set via `wrangler secret put`, see scripts/deploy-wizard.sh; for `wrangler dev`, in .dev.vars):
# TINYURL_API_KEY      - TinyURL API token for create_shareable_url; unset → links are not shortened
# SESSION_HMAC_SECRET  - HMAC key deriving room ids from x-openai-session; unset → those requests fail

# Named environments inherit account_id and the top-level settings above but not `vars` or
# `durable_objects`, so those are repeated; migrations are top-level and apply to every
# environment. Secrets are per environment: `wrangler secret put <NAME> --env <env>`.

# ── Development deployment: "Juicebot view dev" ──────────────────────────────
# The dev stack (docs/test-deployment.md): Worker juicebot-view-mcp-dev at
# https://juicebot-view-mcp-dev.3dg.io, paired with the Pages project juicebot-view-dev at
# https://juicebot-view-dev.pages.dev/ (aidenlab/juicebox-view). It shares nothing with
# production: its own Rooms, sessions and secrets, and only its own Page is allowed.
# `scripts/deploy-dev.sh <path to juicebox-view> [branch-or-tag]`; secrets with `wrangler secret put <NAME> --env view-dev`.
[env.view-dev]
name = "juicebot-view-mcp-dev"
routes = [
  { pattern = "juicebot-view-mcp-dev.3dg.io", custom_domain = true },
]
workers_dev = false
preview_urls = false

[[env.view-dev.durable_objects.bindings]]
name = "WEBSOCKET_ROOM"
class_name = "WebSocketRoom"

[[env.view-dev.durable_objects.bindings]]
name = "MCP_SESSION"
class_name = "McpSession"

[env.view-dev.vars]
# The MCP serverInfo name, so this stack's connector is told apart from production's.
SERVER_NAME = "juicebot-view-server"
# For a local juicebox-view dev server instead, override in .dev.vars or use
# http://localhost:5173/.
BROWSER_URL = "https://juicebot-view-dev.pages.dev/"
TINYURL_DOMAIN = "t.3dg.io"
TINYURL_ENDPOINT = "https://api.tinyurl.com/create"
ALLOWED_ORIGINS = [
  "https://juicebot-view-dev.pages.dev",
  "http://localhost:5173",
  "http://127.0.0.1:5173",
]

# Juicebot production: Worker `juicebot-mcp` on juicebot-mcp.3dg.io, page juicebox-view on
# juicebot.3dg.io (Pages project `juicebot-web`, named before the page moved to juicebox-view). Deployed only from a release tag by scripts/deploy-prod.sh, never by hand:
# `scripts/deploy-prod.sh prod-YYYY-MM-DD`. Secrets: `wrangler secret put <NAME> --env prod`.
[env.prod]
name = "juicebot-mcp"
routes = [
  { pattern = "juicebot-mcp.3dg.io", custom_domain = true },
]
workers_dev = false
preview_urls = false

[[env.prod.durable_objects.bindings]]
name = "WEBSOCKET_ROOM"
class_name = "WebSocketRoom"

[[env.prod.durable_objects.bindings]]
name = "MCP_SESSION"
class_name = "McpSession"

[env.prod.vars]
BROWSER_URL = "https://juicebot.3dg.io/"
TINYURL_DOMAIN = "t.3dg.io"
TINYURL_ENDPOINT = "https://api.tinyurl.com/create"
ALLOWED_ORIGINS = [
  "https://juicebot.3dg.io",
  "https://juicebot-web.pages.dev",
]
